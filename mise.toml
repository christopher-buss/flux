[env]
_.path = [
  '{{config_root}}/node_modules/.bin',
  '{{cwd}}/node_modules/.bin',  
]
_.file = { path = ".env", redact = true }

[settings]
experimental = true

[settings.node]
corepack = true

[tools]
"github:luau-lang/lute" = "1.0.0"
"github:rojo-rbx/rojo" = "v7.7.0"
"npm:@antfu/ni" = "latest"
"npm:corepack" = "latest"
# Pinned: hk.pkl amends the 1.x Config schema, which hk 2.x cannot evaluate.
hk = "1.57.0"
node = { version = "lts", postinstall = "corepack enable" }
pkl = "latest"
